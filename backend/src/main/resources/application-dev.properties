# =====================================================================
# Perfil dev (padrão): H2 em arquivo (./data/lure-db) em modo PostgreSQL.
# Apague a pasta ./data para começar do zero.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lure-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Cria o membro demo e módulos/aulas de exemplo (só quando ainda não há módulos).
app.seed.demo=${SEED_DEMO:true}

logging.level.br.com.lure.growth=INFO
