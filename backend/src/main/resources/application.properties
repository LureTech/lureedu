# =====================================================================
# LURE Growth — configuração comum a todos os perfis.
# Perfis: dev (padrão, H2 em arquivo) · prod (PostgreSQL). Veja application-*.properties.
# Todo segredo/URL pode ser sobrescrito por variável de ambiente.
# =====================================================================
spring.application.name=lure-growth
spring.profiles.default=dev
server.port=${PORT:8085}

# --- JPA / Flyway (o schema é 100% controlado pelo Flyway) ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Pool de conexões (Hikari) ---
# O pooler do Supabase derruba conexões ociosas sem avisar; quando isso acontece, a requisição
# seguinte paga o custo de abrir uma conexão TLS nova (~3s). O keepalive testa a conexão antes
# disso e o max-lifetime a recicla antes do limite do pooler.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:180000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}

# --- Uploads (limite global; cada rota valida o seu próprio limite) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
# Deixa o Tomcat ler o corpo inteiro de uploads grandes, para devolver 413 em JSON em vez de derrubar a conexão.
server.tomcat.max-swallow-size=-1

# --- JSON: datas ISO-8601 e campos nulos sempre presentes ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=UTC

# --- JWT ---
# JWT_SECRET: segredo HS256 com pelo menos 32 caracteres. O valor padrão abaixo é SÓ para dev
# (um aviso é logado na inicialização); o perfil prod exige a variável.
app.jwt.secret=${JWT_SECRET:lure-growth-dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
app.jwt.issuer=lure-growth
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=12h
app.jwt.refresh-token-remember-ttl=30d

# --- CORS: origens permitidas, separadas por vírgula ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- URL pública do frontend (usada no link de redefinição de senha) ---
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# --- Passkeys / Face ID (WebAuthn) ---
# RP ID = domínio do site, sem protocolo/porta (ex.: lure.com.br). Origens = URLs exatas do frontend.
# Face ID e Windows Hello só funcionam em HTTPS (ou em http://localhost no dev).
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=AssessoriaLure
app.webauthn.origins=${WEBAUTHN_ORIGINS:${app.frontend-url}}

# --- Arquivos enviados (servidos em /files/**) ---
app.storage.dir=${STORAGE_DIR:./data/uploads}

# --- Conta admin criada na primeira inicialização (troque a senha depois!) ---
app.admin.email=${ADMIN_EMAIL:admin@lure.com.br}
app.admin.password=${ADMIN_PASSWORD:Lure@2026}

# --- Conteúdo de demonstração (membro demo + módulos de exemplo) ---
app.seed.demo=${SEED_DEMO:false}

# --- E-mail ---
# O envio só é ativado quando spring.mail.host estiver definido (env SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). Sem SMTP, o link de
# redefinição de senha é escrito no log.
app.mail.from=${MAIL_FROM:AssessoriaLure <nao-responda@lure.com.br>}
