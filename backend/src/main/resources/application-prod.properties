# =====================================================================
# Perfil prod: PostgreSQL 16. Ative com SPRING_PROFILES_ACTIVE=prod.
# Variáveis obrigatórias: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET.
# Recomendadas: APP_FRONTEND_URL, CORS_ALLOWED_ORIGINS, STORAGE_DIR, ADMIN_EMAIL, ADMIN_PASSWORD,
#               SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD, MAIL_FROM.
# =====================================================================
# ex.: jdbc:postgresql://db:5432/lure
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Sem valor padrão: a aplicação não sobe sem um segredo real.
app.jwt.secret=${JWT_SECRET}

app.seed.demo=${SEED_DEMO:false}

# Atrás do nginx (X-Forwarded-*)
server.forward-headers-strategy=framework
