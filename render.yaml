# Backend (Spring Boot) no Render — o frontend fica na Vercel (vercel.json) e chama /api por rewrite.
# Os valores com sync: false são pedidos no painel ao criar o Blueprint (ficam fora do Git):
# copie DB_URL, DB_USERNAME e DB_PASSWORD do supabase.env.
services:
  - type: web
    name: lureedu-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_FLYWAY_SCHEMAS
        value: lure
      - key: SPRING_FLYWAY_DEFAULT_SCHEMA
        value: lure
      # O pooler gratuito do Supabase aceita poucas conexões; o backend local também usa algumas.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: APP_FRONTEND_URL
        value: https://lureedu.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://lureedu.vercel.app
      - key: WEBAUTHN_RP_ID
        value: lureedu.vercel.app
      # O plano free tem 512 MB de RAM.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
